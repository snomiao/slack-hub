name: Pages

# Deploys site/ to https://slack-hub.pages.dev and keeps the old
# https://slack-term.pages.dev as a 301 redirect to it (path preserved).
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Token scope: SNOLAB account, Cloudflare Pages: Edit only.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Deploy slack-hub.pages.dev
        run: npx --yes wrangler@4.105.0 pages deploy site --project-name slack-hub --branch main
      - name: Redirect slack-term.pages.dev
        run: |
          d=$(mktemp -d)
          echo '/* https://slack-hub.pages.dev/:splat 301' > "$d/_redirects"
          npx --yes wrangler@4.105.0 pages deploy "$d" --project-name slack-term --branch main
