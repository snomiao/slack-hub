# Builds the Rust `slack` binary for every platform, packs it together with
# the JavaScript the package still ships, and checks on Linux, macOS and
# Windows (x64 and arm64) that `bun i -g` / `npm i -g` gives a working command.
#
# It does not publish. Releases still go through release.yml.
#
# The pipeline lives in https://github.com/snomiao/rustify.

name: rust-npm-release

on:
  pull_request:
    paths:
      - "rs/**"
      - "package.json"
      - ".github/workflows/rust-npm-release.yml"
      # The proof that the binary behaves like the TypeScript, and what it runs on.
      - "tests/parity.test.ts"
      - "tests/mock.ts"
      - "tests/slack-markdown.ts"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without a leading v (default: the version in rs/Cargo.toml)"
        required: false
        type: string

jobs:
  build:
    uses: snomiao/rustify/.github/workflows/rust-npm-build.yml@releases/v1
    with:
      manifest: rs/Cargo.toml
      bins: slack
      version: ${{ inputs.version }}
      js-build: bun install --frozen-lockfile && bun run build
      # Every command the binary answers itself must behave exactly like the
      # TypeScript: tests/parity.test.ts runs both against a mock Slack and
      # compares everything they print, send and leave behind. It runs against
      # the binary just built ($RUSTIFY_BIN_DIR/slack) and has to pass.
      parity: bun install --frozen-lockfile && bun test tests/parity.test.ts --timeout 90000
      # `--version` and `search` are answered by the binary itself; search
      # needs a token and Slack, so the parity job covers it. Every other
      # command is still handed back to the JavaScript, checked here too.
      smoke: slack --version
      smoke-extra: |
        slack --help => slack <command>
        slack search --help => slack search <query>
